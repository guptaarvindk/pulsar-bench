[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "pulsar-framework"
version = "0.1.0"
description = "Test framework for orchestrating Pulsar benchmark runs, collecting storage metrics, and generating reports."
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "requests>=2.31",
    "pydantic>=2.6",
    "rich>=13.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["ruff", "mypy"]

[project.scripts]
pfctl = "pulsar_framework.cli:app"

[tool.pytest.ini_options]
testpaths = ["experiments"]
markers = [
    "scale: concurrency scaling experiments",
    "ttfb: TTFB analysis experiments",
    "cache: cache effectiveness experiments",
    "slow: long-running experiments",
]

[tool.ruff]
line-length = 100
target-version = "py311"
